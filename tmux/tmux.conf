set-option -g history-limit 25000
set -g mouse on

# for neovim
set -sg escape-time 10

# vi for copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi Y send-keys -X select-line \; send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi W send-keys -X select-word \; send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# status bar
set -g status-style "fg=#8b949e"
set -g status-left-style "fg=#e6edf3,bg=#21262d,bold"
set -g status-right-style "fg=#8b949e"

set -g status-bg default
set -g status-position top
set -g status-interval 1
set -g status-left " #S #{?client_prefix,#[fg=#0d1117]#[bg=#d29922]#[bold] P #[default],#[fg=#8b949e] P #[default]} #[fg=#30363d]│#[default] "
setw -g window-status-separator "#[fg=#30363d] │ #[default]"
set -g status-left-length 60
set -g status-right-length 60

# window tabs: muted inactive, subtle GitHub Dark highlight for current window
setw -g window-status-style "fg=#8b949e,bg=default"
setw -g window-status-current-style "fg=#e6edf3,bg=#161b22,bold"

# pane borders: muted inactive, subtle active
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#8b949e"

setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# disable status
# set -g status off
# set -g status on

# count the panes from 1
set -g base-index 1
setw -g pane-base-index 1

# reload configuration
bind-key -r r source-file ~/.tmux.conf

# term colors, these are the correct ones according to neovim checkhealth

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -s set-clipboard on
set-option -g default-shell /bin/zsh
set -g status-right "#(/bin/bash $HOME/.tmux/kube-tmux/kube.tmux 245 #f85149 #2f81f7)"

# URL Launcher
bind-key C-u run-shell -b "tmux capture-pane -J -p | grep -oE '(https?):\\/\\/[^| ]*' | fzf-tmux -d20 --multi --bind alt-a:select-all,alt-d:deselect-all | xargs open"
bind-key C-l run-shell -b "tmux capture-pane -J -p | tail -r | fzf-tmux -d20 | xargs echo -n | pbcopy"
bind-key C-d run-shell -b "tmux capture-pane -J -p > ~/tmux-pane-dump.txt"
